name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      GST_VERSION: '1.26.10'
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version" }
      - name: Install GStreamer runtime and development files
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc"
          foreach ($kind in @('gstreamer-1.0', 'gstreamer-1.0-devel')) {
            $name = "$kind-msvc-x86_64-$env:GST_VERSION.msi"
            $file = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest "$base/$name" -OutFile $file
            $checksum = (Invoke-WebRequest "$base/$name.sha256sum").Content
            if ($checksum -is [byte[]]) { $checksum = [Text.Encoding]::UTF8.GetString($checksum) }
            $expected = ($checksum.Trim() -split '\s+')[0]
            if ((Get-FileHash $file -Algorithm SHA256).Hash -ne $expected) { throw "Checksum mismatch: $name" }
            $log = Join-Path $env:RUNNER_TEMP "$kind.log"
            $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$file`" /qn /norestart ADDLOCAL=ALL INSTALLDIR=C:\gstreamer /l*v `"$log`""
            if ($process.ExitCode -notin @(0, 3010)) { Get-Content $log -Tail 50; throw "MSI failed: $($process.ExitCode)" }
          }
          # MSI сам решает, куда дописать 1.0\msvc_x86_64, поэтому корень ищем по gst-inspect.
          $inspect = Get-ChildItem 'C:\gstreamer', "$env:ProgramFiles\gstreamer" -Filter gst-inspect-1.0.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $inspect) { throw 'gst-inspect-1.0.exe not found after GStreamer install' }
          $root = $inspect.Directory.Parent.FullName
          Write-Host "GStreamer root: $root"
          "$root\bin" >> $env:GITHUB_PATH
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root\" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" >> $env:GITHUB_ENV
      - name: Toolchain
        run: rustup update stable --no-self-update
      - name: Verify required plugins
        shell: pwsh
        run: |
          foreach ($plugin in @('d3d11screencapturesrc', 'wasapi2src', 'x264enc', 'avenc_aac', 'mp4mux', 'jpegenc')) {
            gst-inspect-1.0 $plugin
            if ($LASTEXITCODE -ne 0) { throw "Missing GStreamer plugin: $plugin" }
          }
      - run: cargo +stable test --locked
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $label = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { 'dev' }
          $zip = "replay-rs-$label-windows-x86_64.zip"
          $root = 'dist/replay-rs-windows-x86_64'
          New-Item -ItemType Directory -Force "$root/target/release", "$root/packaging", "$root/docs" | Out-Null
          Copy-Item target/release/replay-rs.exe "$root/target/release/"
          Copy-Item packaging/*windows.ps1 "$root/packaging/"
          Copy-Item README.md $root
          Copy-Item docs/windows.md, docs/architecture.md "$root/docs/"
          Compress-Archive "$root/*" "dist/$zip"
          $hash = (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content dist/SHA256SUMS -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: replay-rs-windows-x86_64
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: replay-rs-windows-x86_64
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Тег с суффиксом (v0.2.0-beta.1) — pre-release, он не становится Latest.
          pre=()
          if [[ "$TAG" == *-* ]]; then pre=(--prerelease); fi
          notes="docs/releases/$TAG.md"
          if [[ ! -f "$notes" ]]; then echo "Missing release notes: $notes" >&2; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "replay-rs $TAG" \
              --notes-file "$notes" "${pre[@]}"
          fi
