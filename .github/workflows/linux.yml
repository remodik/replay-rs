name: Linux
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - name: Install GStreamer development files and plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - name: Verify required plugins
        run: |
          for plugin in appsrc h264parse mp4mux x264enc avenc_aac jpegenc videotestsrc; do
            gst-inspect-1.0 --exists "$plugin" || { echo "Missing GStreamer plugin: $plugin" >&2; exit 1; }
          done
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Software-only integration tests
        run: cargo test --locked --test software_capture --test service_recovery --test audio_tracks --test encoder_selection --test trim_player -- --ignored --nocapture
      - run: cargo build --release --locked
